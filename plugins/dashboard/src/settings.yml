---
strategy: plugin_merge
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language:
refresh_interval_floor:
polling_url:
polling_headers:
polling_body:
id: 523437
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: weather_source
  field_type: plugin_instance_select
  name: 天気
  plugin_keyname: private_plugin
  description: jma-weather（気象庁 天気）のプラグインを選ぶ
- keyname: calendar_source
  field_type: plugin_instance_select
  name: 予定
  plugin_keyname: google_calendar
  description: Google Calendar プラグインを選ぶ
- keyname: debug
  field_type: select
  name: デバッグ表示
  description: 受け取ったデータをそのまま表示する（データの形の確認用）
  options:
  - しない: 'no'
  - する: 'yes'
  default: 'no'
  optional: true
name: 天気と予定
description: 明日の天気と予定を縦向きで表示
refresh_interval: 60
