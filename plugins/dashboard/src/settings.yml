---
strategy: plugin_merge
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
framework_version: latest
name: 天気と予定
description: 気象庁の天気（jma-weather）と Google カレンダーを 1 画面に描く。縦向き（480×800）用
refresh_interval: 60
custom_fields:
- keyname: weather_source
  field_type: plugin_instance_select
  name: 天気
  plugin_keyname: private_plugin
  description: jma-weather（気象庁 天気）のプラグインを選ぶ
- keyname: calendar_source
  field_type: plugin_instance_select
  name: 予定
  plugin_keyname: google_calendar
  description: Google Calendar プラグインを選ぶ
