# TRMNLP configuration
---
# The user's time zone on TRMNL, for trmnl.user.utc_offset.
time_zone: Asia/Tokyo

watch:
  - .trmnlp.yml
  - src

# The plugins chosen in the settings form on TRMNL (plugin_instance_select fields).
custom_fields:
  weather_source: private_plugin_1
  calendar_source: google_calendar_1

# Stand-ins for the plugins merged on TRMNL, keyed by placeholder ids.
merged_plugins:
  private_plugin_1: ../jma-weather
  google_calendar_1: fixtures/google-calendar

variables:
  trmnl: {}
